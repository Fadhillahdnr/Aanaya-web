services:
  app:
    build:
      context: .
      target: app
    image: aanaya-php-fpm
    env_file:
      - .env
    environment:
      APP_URL: "http://localhost:${APP_PORT:-8000}"
      GOOGLE_REDIRECT_URI: "http://localhost:${APP_PORT:-8000}/auth/google/callback"
      LOG_CHANNEL: stderr
      DB_EMULATE_PREPARES: "true"
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      SESSION_CONNECTION: default
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_CACHE_DB: 1
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "9000"
    volumes:
      - aanaya-storage:/var/www/storage
    restart: unless-stopped

  nginx:
    build:
      context: .
      target: nginx
    image: aanaya-nginx
    depends_on:
      - app
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - aanaya-storage:/var/www/storage:ro
    restart: unless-stopped

  queue:
    image: aanaya-php-fpm
    build:
      context: .
      target: app
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=120
    env_file:
      - .env
    environment:
      APP_URL: "http://localhost:${APP_PORT:-8000}"
      GOOGLE_REDIRECT_URI: "http://localhost:${APP_PORT:-8000}/auth/google/callback"
      LOG_CHANNEL: stderr
      DB_EMULATE_PREPARES: "true"
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      SESSION_CONNECTION: default
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_CACHE_DB: 1
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - aanaya-storage:/var/www/storage
    stop_grace_period: 2m
    restart: unless-stopped

  scheduler:
    image: aanaya-php-fpm
    build:
      context: .
      target: app
    command: php artisan schedule:work
    env_file:
      - .env
    environment:
      APP_URL: "http://localhost:${APP_PORT:-8000}"
      GOOGLE_REDIRECT_URI: "http://localhost:${APP_PORT:-8000}/auth/google/callback"
      LOG_CHANNEL: stderr
      DB_EMULATE_PREPARES: "true"
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      SESSION_CONNECTION: default
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_CACHE_DB: 1
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - aanaya-storage:/var/www/storage
    stop_grace_period: 1m
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - aanaya-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  aanaya-storage:
  aanaya-redis:
